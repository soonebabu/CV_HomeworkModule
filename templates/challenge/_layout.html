{% extends "base.html" %}
{% block sidebar_brand %}Challenge 1 &middot; Long-form video{% endblock %}
{% block head %}
<style>
  .pipeline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; margin: 16px 0 6px; }
  .pipeline .stage { flex: 1 1 130px; background: #161d21; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; }
  .pipeline .stage b { display: block; color: #fff; font-size: 13px; margin-bottom: 4px; }
  .pipeline .stage span { color: var(--muted); font-size: 12px; }
  .pipeline .arrow { align-self: center; color: var(--accent); font-weight: 700; }
  .pipeline .stage.key { border-color: var(--accent); }
  .arm-base { color: #f08a5d; font-weight: 700; }
  .arm-orch { color: #6aa8f0; font-weight: 700; }
  table.result-table td.wrap, table.result-table th.wrap { text-align: left; white-space: normal; }
  table.result-table td.small { font-size: 12px; }
  textarea { width: 100%; background: #161d21; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 8px 10px; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  textarea.story { font-family: inherit; font-size: 14px; }
  details summary { cursor: pointer; color: var(--accent); margin: 8px 0; }
  .ok { color: #7fc98a; } .bad { color: #f08a5d; }
  .wide-img { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .scroll-x { overflow-x: auto; }
  .scroll-x img { max-width: none; height: 190px; border: 1px solid var(--border); border-radius: 8px; }
</style>
{% endblock %}
{% block sidebar_links %}
  <a class="nav-link {{ 'current' if active_page == 'overview' }}" href="{{ url_for('challenge.overview') }}">Overview</a>
  <a class="nav-link {{ 'current' if active_page == 'prototype' }}" href="{{ url_for('challenge.prototype_view') }}">1. Prototype run</a>
  <a class="nav-link {{ 'current' if active_page == 'evaluate' }}" href="{{ url_for('challenge.evaluate_view') }}">2. Evaluate real clips</a>
  <a class="nav-link {{ 'current' if active_page == 'notebook' }}" href="{{ url_for('challenge.notebook_view') }}">3. Colab notebook (real model)</a>
  <a class="nav-link {{ 'current' if active_page == 'method' }}" href="{{ url_for('challenge.method') }}">Method &amp; metrics</a>
  <a class="nav-link samples-link {{ 'current' if active_page == 'samples' }}" href="{{ url_for('samples.gallery', hw='challenge') }}">Sample outputs</a>
{% endblock %}
